# 示例工程 sqlc 配置:两个 sql 块共享同一份 schema.sql(§4.3)。
# 块 1:sqlc-gen-go(built-in gen: go),产出模型与固定查询。
# 块 2:sqlc_gen_dynamic 插件(process 模式),仅消费 Catalog 生成动态 List;
#       queries 字段 sqlc 要求必填但插件忽略。
#
# process.cmd 由 exec.LookPath 解析:相对 sqlc 命令的运行目录。
# 约定:在仓库根目录执行 `make sqlc`(即 sqlc generate -f example/db/sqlc.yaml)。
version: "2"
plugins:
  - name: "sqlc_gen_dynamic"
    process:
      cmd: "bin/sqlc_gen_dynamic"
    # 透传给插件进程的环境变量白名单(如 DYNQ_DUMP_REQUEST=path 做 dump-first 验证)。
    env:
      - "DYNQ_DUMP_REQUEST"
sql:
  - engine: "postgresql"
    schema: "schema.sql"
    queries: "queries.sql"
    gen:
      go:
        package: "gen"
        out: "gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true

  - engine: "postgresql"
    schema: "schema.sql"
    queries: "queries.sql"
    codegen:
      - plugin: "sqlc_gen_dynamic"
        out: "gen"
        options:
          package: "gen"
          runtime_import: "sqlc_gen_dynamic/internal/dynq"
          schema: "public"
          default_ops: "none"
          page_default: 20
          page_max: 200
